name: Cost
options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  developmentLanguage: zh-Hans
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Cost:
    type: application
    platform: iOS
    sources:
      - path: Cost
        excludes:
          - Info.plist
          - Resources/Database
          - "**/.gitkeep"
      - path: Cost/Resources/Database
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cost
        INFOPLIST_FILE: Cost/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        # XcodeGen's AppIcon preset is cleared until icon assets are added in Phase 9.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CostTests
        excludes:
          - Fixtures
          - "**/.gitkeep"
      - path: CostTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Cost
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cost.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cost.app/Cost"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Cost:
    build:
      targets:
        Cost: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CostTests
    archive:
      config: Release
  CostTests:
    build:
      targets:
        Cost: all
        CostTests: [test]
    test:
      config: Debug
      targets:
        - CostTests
