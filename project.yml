name: Cost
options:
  minimumXcodeGenVersion: "2.42.0"
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.3"
  developmentLanguage: zh-Hans
  generateEmptyDirectories: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: "1.6.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "16"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  Cost:
    type: application
    platform: iOS
    sources:
      - path: Cost
        excludes:
          - Info.plist
          - Resources/Database
          - "**/.gitkeep"
      - path: Cost/Resources/Database
        buildPhase: resources
    dependencies:
      - package: GRDB
        product: GRDB
      - package: libwebp
        product: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cost
        INFOPLIST_FILE: Cost/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  CostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CostTests
        excludes:
          - Fixtures
          - "**/.gitkeep"
      - path: CostTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Cost
      - package: GRDB
        product: GRDB
      - package: libwebp
        product: libwebp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cost.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cost.app/Cost"
        BUNDLE_LOADER: "$(TEST_HOST)"

  CostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CostUITests
    dependencies:
      - target: Cost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.cost.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Cost

schemes:
  CostUITests:
    build:
      targets:
        Cost: all
        CostUITests: [test]
    test:
      config: Debug
      targets:
        - CostUITests
  Cost:
    build:
      targets:
        Cost: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CostTests
    archive:
      config: Release
  CostTests:
    build:
      targets:
        Cost: all
        CostTests: [test]
    test:
      config: Debug
      targets:
        - CostTests
